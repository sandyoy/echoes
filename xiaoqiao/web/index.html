<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小桥的学习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1f2937;font-size:17px;line-height:1.75;padding-bottom:80px;
  --kb:0px;            /* 软键盘高度，JS 实时写进来 */
  --fbbar:80px;        /* 底部按钮条高度 */
}
/* 键盘弹出时：页面底部让出键盘的位置，就能滚到键盘上面去写 */
body.kb-up{padding-bottom:calc(var(--kb) + 96px)}
body.kb-up .footer-bar{transform:translateY(calc(-1 * var(--kb)))}
body.kb-up .fab{bottom:calc(96px + var(--kb))}
body.kb-up .sheet{height:calc(72vh - var(--kb));transition:none}
body.kb-up #summaryBox{bottom:calc(var(--kb) + 8px)}

/* 键盘顶上的快跳条：弹着键盘也能上一题/下一题，不用先收键盘 */
#jumpBar{position:fixed;left:0;right:0;bottom:var(--kb);z-index:130;display:none;align-items:center;gap:8px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.98);
  box-shadow:0 -3px 16px rgba(0,0,0,.13);border-top:1px solid #f0f0f0}
#jumpBar.show{display:flex}
#jumpBar .jp{border:1.5px solid #ffd9a0;background:#fff8ec;color:#c25a00;border-radius:18px;
  padding:8px 13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
#jumpBar .jp.main{background:linear-gradient(135deg,#ffb340,#ff8a00);border-color:transparent;color:#fff;flex:1}
#jumpBar .jp.done{background:#f3f4f6;border-color:#e5e7eb;color:#6b7280;font-weight:500}
#jumpBar .pos{font-size:13px;color:#9ca3af;white-space:nowrap}
.header{background:linear-gradient(135deg,#ffb340,#ff8a00);color:#fff;padding:22px 20px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(255,138,0,.25)}
.header h1{font-size:21px;font-weight:700;letter-spacing:.5px}
.header p{font-size:13px;opacity:.92;margin-top:4px}
.header .ttsbtn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.25);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:19px;cursor:pointer;line-height:1}
.header .ttsbtn:active{transform:translateY(-50%) scale(.92)}
.wrap{padding:16px}
.card{background:#fff;border-radius:14px;padding:18px 17px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.card h2{font-size:17px;color:#ff8a00;margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .tag{background:#fff3e0;color:#e67300;font-size:12px;padding:2px 8px;border-radius:9px;font-weight:500}
.say{background:#fffbf0;border-left:4px solid #ffb340;padding:14px 15px;border-radius:8px;font-size:16px;line-height:1.85;color:#4a3a20;position:relative}
.say p{margin-bottom:9px}
.say p:last-child{margin-bottom:0}
.say .replay{position:absolute;right:10px;bottom:8px;background:#fff3e0;border:1px solid #ffd9a0;color:#e67300;border-radius:14px;padding:2px 11px;font-size:12px;font-family:inherit;cursor:pointer}
.q{margin-bottom:18px}
.q .stem{font-weight:600;margin-bottom:9px;color:#1f2937}
.blank{display:inline-block;min-width:76px;border-bottom:2px solid #ffb340;height:24px;margin:0 4px;vertical-align:bottom}
input[type=text]{width:100%;border:1.5px solid #e5e7eb;border-radius:9px;padding:11px 13px;font-size:16px;font-family:inherit;background:#fafbfc;transition:border-color .2s,background .2s,box-shadow .2s}
input[type=text]:focus{outline:none;border-color:#ffb340;background:#fff;box-shadow:0 0 0 3px rgba(255,179,64,.15)}
textarea{width:100%;border:1.5px solid #e5e7eb;border-radius:9px;padding:11px 13px;font-size:16px;font-family:inherit;background:#fafbfc;min-height:76px;resize:none;overflow:hidden;transition:border-color .2s,background .2s,box-shadow .2s}
textarea:focus{outline:none;border-color:#ffb340;background:#fff;box-shadow:0 0 0 3px rgba(255,179,64,.15)}
/* 正在写的这道题：整道题亮起来，一眼就知道现在写的是哪一题 */
.q.editing .stem{color:#c25a00}
.q.editing input,.q.editing textarea{border-color:#ff8a00;background:#fffdf8;box-shadow:0 0 0 4px rgba(255,138,0,.14)}
.hint{font-size:13px;color:#9ca3af;margin-top:7px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.row .idx{color:#ff8a00;font-weight:700;min-width:24px}
.row .item{flex:1}
.btn{display:block;width:100%;background:linear-gradient(135deg,#ffb340,#ff8a00);color:#fff;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 3px 12px rgba(255,138,0,.3);transition:.15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:#ff8a00;border:2px solid #ffb340;box-shadow:none}
.footer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);padding:12px 16px 20px;box-shadow:0 -2px 14px rgba(0,0,0,.07);backdrop-filter:blur(10px)}
.done{text-align:center;padding:40px 20px}
.done .big{font-size:52px;margin-bottom:14px}
.done h2{color:#ff8a00;font-size:22px;margin-bottom:10px}
.done p{color:#6b7280;font-size:15px;line-height:1.9}
.progress{position:fixed;top:0;left:0;height:3px;background:#22c55e;width:0;z-index:99;transition:width .3s}
.hidden{display:none}
.summary{background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px;padding:15px;margin-top:14px;font-size:14px;color:#166534;line-height:1.85}
.summary b{color:#15803d}

/* 开场封面：老师形象 + 说话 */
.cover{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#ffc76b 0%,#ff9d2e 55%,#ff8a00 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;transition:opacity .45s,transform .45s}
.cover.out{opacity:0;transform:scale(1.06);pointer-events:none}
.avatar{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 10px 34px rgba(150,70,0,.3);margin-bottom:22px;transition:transform .5s}
.avatar.talk{animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.06) translateY(-5px)}}
.cover h2{color:#fff;font-size:23px;font-weight:700;margin-bottom:12px;text-shadow:0 2px 8px rgba(150,70,0,.25)}
.cover .line{color:#fff;font-size:16px;line-height:1.95;max-width:330px;opacity:.96;margin-bottom:8px;text-shadow:0 1px 6px rgba(150,70,0,.2)}
.cover .tap{color:#fff;font-size:14px;opacity:.88;margin-top:16px;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
.cover .go{margin-top:26px;background:#fff;color:#ff8a00;border:none;border-radius:26px;padding:14px 44px;font-size:18px;font-weight:700;font-family:inherit;box-shadow:0 6px 20px rgba(150,70,0,.28);cursor:pointer}
.cover .go:active{transform:scale(.96)}
.cover .skip{position:absolute;bottom:26px;color:#fff;opacity:.6;font-size:13px;background:none;border:none;font-family:inherit}

/* 跟老师说话 */
.talkcard{border:2px solid #ffd9a0;background:#fffdf7}
.talktip{font-size:14px;color:#8a6a35;margin-bottom:12px;line-height:1.7}
.chatlog{margin-bottom:12px}
.chatlog:empty{display:none}
.bubble{background:#ff8a00;color:#fff;padding:11px 14px;border-radius:14px 14px 4px 14px;margin-bottom:9px;font-size:15px;line-height:1.7;max-width:88%;margin-left:auto;word-break:break-word}
.bubble .who{font-size:11px;opacity:.75;display:block;margin-bottom:3px}
.bubble.reply{background:#fff3e0;color:#7a4a00;border-radius:14px 14px 14px 4px;margin-left:0}
.talkrow{display:flex;gap:9px}
.talkrow input{flex:1}
.talkbtn{background:linear-gradient(135deg,#ffb340,#ff8a00);color:#fff;border:none;border-radius:10px;padding:0 17px;font-size:15px;font-weight:700;font-family:inherit;white-space:nowrap;cursor:pointer}
.talkbtn:active{transform:scale(.96)}
.thinking{opacity:.75}
.dots{display:inline-flex;gap:4px;align-items:center;height:20px}
.dots i{width:6px;height:6px;border-radius:50%;background:#ff8a00;display:block;animation:dotbounce 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes dotbounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* ===== 浮动「问老师」按钮 ===== */
.fab{position:fixed;right:16px;bottom:96px;z-index:60;display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#ffb340,#ff8a00);color:#fff;border:none;border-radius:26px;padding:12px 19px;font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 6px 18px rgba(255,138,0,.42);cursor:pointer;transition:.18s}
.fab:active{transform:scale(.94)}
.fab .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.fab.hide{display:none}

/* ===== 聊天抽屉（像微信） ===== */
.sheet{position:fixed;left:0;right:0;bottom:0;height:72vh;background:#f5f7fa;z-index:200;border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.22);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .3s ease}
.sheet.open{transform:translateY(0)}
.sheet-head{background:linear-gradient(135deg,#ffb340,#ff8a00);color:#fff;padding:13px 16px;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:10px;flex-shrink:0}
.sheet-head .who2{font-size:16px;font-weight:700;flex:1}
.sheet-head .st{font-size:12px;opacity:.9}
.sheet-head .x{background:rgba(255,255,255,.22);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer}
.spk{background:rgba(255,255,255,.22);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;margin-left:auto}
.spk.off{background:rgba(0,0,0,.22)}
.sheet-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.sheet-body .bubble{max-width:82%;margin:0}
.sheet-body .bubble.reply{margin-left:0}
.sheet-body .bubble:not(.reply){margin-left:auto}
.sheet-foot{background:#fff;padding:10px 12px 16px;display:flex;gap:8px;flex-shrink:0;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.sheet-foot input{flex:1;border:1.5px solid #e5e7eb;border-radius:20px;padding:11px 16px;font-size:16px;font-family:inherit;background:#f7f8fa}
.sheet-foot input:focus{outline:none;border-color:#ffb340;background:#fff}
.sheet-foot button{background:linear-gradient(135deg,#ffb340,#ff8a00);color:#fff;border:none;border-radius:20px;padding:0 20px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.mask.on{opacity:1;pointer-events:auto}
.quickrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.quickrow button{background:#fff;border:1.5px solid #ffd9a0;color:#e67300;border-radius:15px;padding:6px 13px;font-size:13px;font-family:inherit;cursor:pointer}
.quickrow button:active{background:#fff3e0}
</style>
</head>
<body>

<!-- ===== 开场封面 ===== -->
<div class="cover" id="cover">
  <div class="avatar" id="avatar">👩‍🏫</div>
  <h2>小桥，你好呀</h2>
  <p class="line">我是圆圆老师，从今天起我陪你一起学习</p>
  <p class="line" style="font-size:15px;opacity:.9">今天先做一组小题，我看看你哪儿会、哪儿不会</p>
  <button class="go" id="goBtn" onclick="startStudy()">开始学习</button>
  <div class="tap" id="tapHint">点上面的按钮，老师会跟你说话</div>
  <button class="skip" onclick="skipIntro()">跳过</button>
</div>

<div class="progress" id="prog"></div>

<div class="header">
  <h1>小桥的学习</h1>
  <p id="quizSub">第 1 天 · 约 20 分钟</p>
  <button class="ttsbtn" onclick="speak('02_start')" title="老师再说一遍">🔊</button>
</div>

<div class="wrap" id="main">

  <div class="card">
    <div class="say">
      <p>小桥，我是你的老师。</p>
      <p>你妈妈跟我说了，你打算用一年时间，把一到六年级的东西系统地过一遍。明年下半年就能集中复习。</p>
      <p>我觉得这个计划很好，而且你同意开始，这本身就挺了不起的。</p>
      <p>今天我们先做一件很小的事：我想看看你哪儿会、哪儿不会。<b>做不出来的就空着，空着不是错，空着是告诉我"这里要教你"。</b></p>
      <p>准备好了吗？开始吧。</p>
      <button class="replay" onclick="speak('02_start')">🔊 再听一遍</button>
    </div>
  </div>

  <div id="quizCards"></div>

  <div id="summaryBox" class="summary hidden"></div>

</div>

<!-- 浮动「问老师」按钮：随时可点 -->
<button class="fab" id="fab" onclick="openChat()">
  <span class="dot"></span>问老师
</button>

<!-- 遮罩 -->
<div class="mask" id="mask" onclick="closeChat()"></div>

<!-- 聊天抽屉：像微信 -->
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <div>
      <div class="who2">圆圆老师</div>
      <div class="st" id="stText">随时问我，不会也能问</div>
    </div>
    <button class="spk" id="spkBtn" onclick="toggleVoice()" title="关掉老师的聲音，只看文字">🔊</button>
    <button class="x" onclick="closeChat()">✕</button>
  </div>
  <div class="sheet-body" id="chatlog"></div>
  <div class="sheet-foot">
    <input type="text" id="talkInput" placeholder="跟老师说句话…"
           onkeydown="if(event.key==='Enter')sayToTeacher()">
    <button onclick="sayToTeacher()">发送</button>
  </div>
</div>

<div class="footer-bar">
  <button class="btn" id="submitBtn" onclick="submitAll()">我写完了，交给老师</button>
</div>

<script>

/* ===== 出题引擎（2026-11-19 接入）：题目不再写死在页面里 ===== */
/* 数据优先级：?day=N 或 按开始日期算天数 -> 先试服务器 /api/quiz（带上昨天错题）,
   拿不到就用内联的 QUZ（已按当天规则生成好，离线也能用）。 */
const QUZ = {"v": "1.0", "day": 3, "title": "第 3 天", "learner": "小桥", "subtitle": "第 3 天 · 约 20 分钟 · 共 14 题", "note": "本套题由出题引擎按第 3 天规则生成（种子固定，同一天永远同一套）", "parts": [{"name": "开始", "tag": "", "say": "今天还是四块：拼音、乘法口诀、英语，最后跟我说三句话。做不出来的就空着，空着不是错，空着是告诉我「这里要教你」。", "qs": []}, {"name": "语文", "tag": "语文", "say": "", "qs": [{"id": "y1", "stem": "给「骂」标上声调（写拼音）", "ans": ["mà4", "mà"], "ref": "骂", "ph": "写带声调的拼音"}, {"id": "y2", "stem": "给「妈」标上声调（写拼音）", "ans": ["mā1", "mā"], "ref": "妈", "ph": "写带声调的拼音"}, {"id": "y3", "stem": "给「麻」标上声调（写拼音）", "ans": ["má2", "má"], "ref": "麻", "ph": "写带声调的拼音"}]}, {"name": "数学", "tag": "数学", "say": "", "qs": [{"id": "m1", "stem": "5 × 3 = ？", "ans": ["15"], "ref": "5×3", "ph": "填数字"}, {"id": "m2", "stem": "5 × 7 = ？", "ans": ["35"], "ref": "5×7", "ph": "填数字"}, {"id": "m3", "stem": "5 × 9 = ？", "ans": ["45"], "ref": "5×9", "ph": "填数字"}, {"id": "m4", "stem": "5 × 2 = ？", "ans": ["10"], "ref": "5×2", "ph": "填数字"}]}, {"name": "英语", "tag": "英语", "say": "", "qs": [{"id": "e1", "stem": "「睡觉」用英语怎么说？", "ans": ["go to bed"], "ref": "睡觉", "ph": "写英文"}, {"id": "s1", "stem": "用「go to bed」说一句话（不会就空着）", "ans": ["I go to bed at nine."], "ref": "go to bed", "ph": "写句子", "ta": true}, {"id": "e2", "stem": "「踢足球」用英语怎么说？", "ans": ["play football"], "ref": "踢足球", "ph": "写英文"}, {"id": "s2", "stem": "用「play football」说一句话（不会就空着）", "ans": ["I play football after school."], "ref": "play football", "ph": "写句子", "ta": true}, {"id": "e3", "stem": "「吃早饭」用英语怎么说？", "ans": ["have breakfast"], "ref": "吃早饭", "ph": "写英文"}, {"id": "s3", "stem": "用「have breakfast」说一句话（不会就空着）", "ans": ["I have breakfast at seven thirty."], "ref": "have breakfast", "ph": "写句子", "ta": true}]}, {"name": "跟我说三句话", "tag": "聊一聊", "say": "最后随便跟我说说，没有对错。", "qs": [{"id": "o1", "stem": "今天学的这些东西里，你觉得哪一条最难？为什么？", "ans": [], "ref": "说一说", "open": true, "ph": "想到什么写什么，写不出来就空着", "ta": true}]}]};
let QIDS = [];
let answers = {};
const START_DATE = '2026-11-17';

function dayNo(){
  const u = new URLSearchParams(location.search);
  if(u.get('day')) return Math.max(1, parseInt(u.get('day'), 10) || 1);
  const d = new Date(); d.setHours(0,0,0,0);
  const s = new Date(START_DATE + 'T00:00:00');
  return Math.max(1, Math.round((d - s) / 86400000) + 1);
}
let QUIZ = QUZ;
if(QUZ.day !== dayNo()) QUIZ.day = dayNo();

function renderQuiz(q){
  const box = document.getElementById('quizCards');
  if(!box) return;
  box.innerHTML = '';
  let k = 0;
  (q.parts || []).forEach(part=>{
    if(part.say){
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = '<div class="say"><p>' + esc(part.say) + '</p></div>';
      box.appendChild(c);
    }
    if(!part.qs || !part.qs.length) return;
    const c = document.createElement('div'); c.className = 'card';
    const h = document.createElement('h2');
    h.innerHTML = esc(part.name) + (part.tag ? ' <span class="tag">' + esc(part.tag) + '</span>' : '');
    c.appendChild(h);
    part.qs.forEach(qq=>{
      k++;
      const id = (qq.id || ('q' + k)) + '_' + k;
      QIDS.push(id);
      if(qq.ans && qq.ans.length) answers[id] = qq.ans;
      const d = document.createElement('div'); d.className = 'q';
      const stem = document.createElement('div'); stem.className = 'stem';
      stem.textContent = k + '. ' + (qq.stem || '');
      d.appendChild(stem);
      let el;
      if(qq.ta){ el = document.createElement('textarea'); }
      else { el = document.createElement('input'); el.type = 'text'; }
      el.id = id;
      el.placeholder = qq.ph || '不会就空着';
      el.dataset.ref = qq.ref || qq.stem || '';
      if(qq.open) el.dataset.open = '1';
      d.appendChild(el);
      c.appendChild(d);
    });
    box.appendChild(c);
  });
  document.querySelectorAll('#quizCards input, #quizCards textarea').forEach(el=>{
    const saved = localStorage.getItem('xq_'+el.id);
    if(saved) el.value = saved;
    el.addEventListener('input', ()=>{
      localStorage.setItem('xq_'+el.id, el.value);
      updateProgress();
    });
  });
  const sub = document.getElementById('quizSub');
  if(sub && q.subtitle) sub.textContent = q.subtitle;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* 拉服务器版题目（带昨天错题做变式复习）；失败就静默用内联版 */
function loadQuiz(){
  const day = QUIZ.day;
  document.querySelectorAll('#quizCards').forEach(b=>{ b.innerHTML = '<div class="card">正在准备今天的题…</div>'; });
  let wrong = [];
  try{ wrong = JSON.parse(localStorage.getItem('xq_wrong_'+day) || '[]'); }catch(e){}
  const p = fetch('api/quiz?day=' + day + (wrong.length ? '&review=' + encodeURIComponent(wrong.join(',')) : ''))
    .then(r=> r.ok ? r.json() : null).catch(()=>null);
  p.then(q=>{
    document.getElementById('quizCards').innerHTML = '';
    QIDS = []; answers = {};
    if(q && q.parts) { QUIZ = q; }
    renderQuiz(QUIZ);
    updateProgress();
  });
}

/* 判分：有标准答案的当场判，开放题不算分，交老师看 */
function gradeLocal(){
  const rows = [];
  let right = 0, total = 0;
  const wrongRefs = [];
  QIDS.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const val = (el.value || '').trim();
    const ref = el.dataset.ref || '';
    const ans = answers[id];
    const open = el.dataset.open === '1' || !ans;
    rows.push({ref, ans: val, open});
    if(open) return;
    total++;
    const norm = s => String(s).replace(/\s+/g, '').replace(/[，。！？,.!?]/g, '').toLowerCase();
    const ok = ans.some(a => norm(a) === norm(val));
    if(ok) right++;
    else wrongRefs.push(ref);
  });
  try{ localStorage.setItem('xq_wrong_' + QUIZ.day, JSON.stringify(wrongRefs)); }catch(e){}
  return {right, total, rows, wrongRefs};
}

/* 播一段（播完才允许下一段） */
let currentAudio = null;

/* 所有发声都从这里走：先掐掉上一段，再把新的登记成 currentAudio，
   这样任何时候按喇叭都能立刻停住正在说的那句。 */
function playOnce(name){
  try{
    stopSpeak();
    const a = new Audio('audio/'+name+'.m4a');
    currentAudio = a;
    const av = document.getElementById('avatar');
    if(av) av.classList.add('talk');
    a.addEventListener('ended', ()=>{ if(currentAudio===a){currentAudio=null;} if(av) av.classList.remove('talk'); });
    a.addEventListener('error', ()=>{ if(currentAudio===a){currentAudio=null;} if(av) av.classList.remove('talk'); });
    a.play().catch(()=>{ if(currentAudio===a){currentAudio=null;} if(av) av.classList.remove('talk'); });
    return a;
  }catch(e){ return null; }
}
function speak(name){ return playOnce(name); }

function stopSpeak(){
  if(currentAudio){
    try{ currentAudio.pause(); currentAudio.currentTime = 0; }catch(e){}
    try{ if(currentAudio.__stopHook) currentAudio.__stopHook(); }catch(e){}
    currentAudio = null;
  }
  // 浏览器朗读也要一起停
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
  const av = document.getElementById('avatar');
  if(av) av.classList.remove('talk');
}

/* ===== 朗读老师说的话（浏览器自带，能被喇叭打断） ===== */
/* 老师说话：一律走服务器 TTS，不用浏览器自带的朗读
   ——手机/微信内置浏览器常没有中文语音，或禁自动播放，会静悄悄不出声。
   ★ 2026-11-18 改：按句切开、逐句边做边播。
     实测：整段 78 字要 7.7 秒才出声，孩子早走神了；
           切成 5 句后第一句 1.5 秒就能开口，后面边播边做。
     句与句之间留 240ms，听感从"念稿"变"讲话"。 */
let _speakSeq = 0;
const _audioQueue = [];      // 待播地址队列
let _playing = false;

function _absUrl(u){
  if(/^https?:|^\//.test(u)) return u;
  // 后端回的是 audio/tts_xxx.mp3，页面在 /xiaoqiao/ 下 → 补成同目录绝对路径
  return location.pathname.replace(/[^/]*$/, '') + u;
}

function _ttsOne(text){
  return fetch('api/tts', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text: text.slice(0,220)})
  }).then(r=>r.json()).then(d=>{
    if(!d || !d.url){ console.warn('[TTS] 无地址', d); return ''; }
    return _absUrl(d.url);
  }).catch(e=>{ console.warn('[TTS] 单句失败', e && e.message); return ''; });
}

/* ★ 2026-11-18：手机/微信的硬规矩——页面在"用户点过屏幕"之前不许出声。
   喇叭默认是开的，但孩子只是打开网页没点过，老师一说话就被拦 → 只看到字、没声音。
   解法：第一次点屏幕就"解锁"一个静音音轨并一直保持，之后所有播放都算在授权内。 */
let _audioUnlocked = false;
function unlockAudio(){
  if(_audioUnlocked) return;
  _audioUnlocked = true;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){
      if(!window.__ac) window.__ac = new AC();
      if(window.__ac.state === 'suspended') window.__ac.resume();
    }
    // 再用一个 0 长度静音 mp3 走一遍 play()，把 <audio> 通道也解锁
    const a = new Audio('data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiEd6s8AAAAASUVORK5CYII=');
    a.volume = 0;
    a.play().catch(()=>{});
  }catch(e){ console.warn('[audio] 解锁失败', e && e.message); }
}
['touchstart','touchend','click','pointerdown','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, {capture:true, passive:true});
});

function _drainQueue(seq){
  if(_playing) return;
  const next = _audioQueue.shift();
  if(!next){ return; }
  if(seq !== _speakSeq){ _audioQueue.length = 0; return; }
  _playing = true;
  const av = document.getElementById('avatar');
  const a = new Audio(next);
  currentAudio = a;
  if(av) a.onplay = ()=>av.classList.add('talk');
  const done = ()=>{
    if(av) av.classList.remove('talk');
    _playing = false;
    if(seq === _speakSeq){
      // 句间停半拍（240ms）再接下一句
      setTimeout(()=>_drainQueue(seq), 240);
    }
  };
  a.onended = done;
  a.onerror = ()=>{ console.warn('[TTS] 加载失败', next); done(); };
  a.play().catch((e)=>{
    console.warn('[TTS] 自动播放被拦', e && e.name);
    _playing = false;
    // 别静默：让家长一眼看见是"被浏览器拦了"而不是"坏了"
    try{
      if(!document.getElementById('_vbar')){
        const d = document.createElement('div');
        d.id='_vbar';
        d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:9999;background:rgba(0,0,0,.82);color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;';
        d.textContent='点一下屏幕，老师就能出声了';
        document.body.appendChild(d);
        setTimeout(()=>{ d.remove(); }, 5000);
      }
    }catch(x){}
    const kick = ()=>{
      document.removeEventListener('touchstart', kick);
      document.removeEventListener('click', kick);
      if(seq === _speakSeq) a.play().catch(()=>{ _playing=false; });
    };
    document.addEventListener('touchstart', kick, {once:true});
    document.addEventListener('click', kick, {once:true});
  });
}

function speakText(text){
  if(!text) return;
  if(!voiceOn) return;          // 老师的声音关了：只出文字，不念
  stopSpeak();
  const seq = ++_speakSeq;
  _audioQueue.length = 0;
  _playing = false;

  const clean = String(text).replace(/[*#`>]/g,'').trim();
  if(!clean) return;

  // 按句子切开（保留标点），丢掉空段
  const parts = clean.split(/(?<=[。！？!?；;])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return;

  // 第一句：拿到就播（大约 1.5 秒）
  _ttsOne(parts[0]).then(url=>{
    if(seq !== _speakSeq) return;
    if(url){ _audioQueue.push(url); _drainQueue(seq); }
    // 其余几句后台依次做，做完就进队列
    let i = 1;
    const nextOne = ()=>{
      if(seq !== _speakSeq || i >= parts.length) return;
      _ttsOne(parts[i++]).then(u=>{
        if(seq !== _speakSeq) return;
        if(u) _audioQueue.push(u);
        _drainQueue(seq);
        nextOne();
      });
    };
    nextOne();
  });
}

/* ===== 键盘避让：软键盘弹出时把正在写的那道题顶到可见处 =====
   问题：一点写字框，手机键盘弹出来盖住半屏，写字框被压在键盘底下看不见；
        textarea 带 resize 手柄，孩子拨不动；改一个字又得关键盘，很难改。
   做法：① 一个隐藏的探针输入框贴在键盘下沿，用 visualViewport / window.innerHeight
          两路读键盘高度（老 WebView 没有 visualViewport 也能算）
        ② 有键盘时 body 底部留出键盘高度的空档，页面就能滚到键盘上面
        ③ 正在写的那个框滚到可见区域中间，并且在它下面垫一块空白，让老师头像挡住也不怕
        ④ 固定贴底的东西（底部按钮条、问老师按钮、聊天抽屉）一起跟着抬起来
        ⑤ 写字框改成可自动长高、关掉 resize 手柄（手柄在手机上根本拨不动）
*/
(function(){
  var lastKb = 0;
  var focusedEl = null;

  function vh(){
    if(window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight;
  }
  /* 键盘高度要分两条路读，缺一条就有一个手机型号算不出来：
     ① 新内核有 visualViewport：键盘弹出时它自己缩，document.clientHeight 不变
        → 键盘高 = document.clientHeight - visualViewport.height
     ② 老内核没 visualViewport：innerHeight 被键盘压小，document.clientHeight 不变
        → 键盘高 = document.clientHeight - innerHeight
     ③ 都不灵（部分安卓把 clientHeight 也一起缩）：拿页面最初记录的满屏高来兜底
     注意：不要减 pageYOffset，页面滚过之后会把结果抵消成 0（实测踩过）。 */
  var FULL_H = Math.max(
    document.documentElement.clientHeight || 0,
    window.innerHeight || 0
  );
  function kbHeight(){
    var docH = document.documentElement.clientHeight || 0;
    var winH = window.innerHeight || 0;
    var vis = vh();
    var byVisual = docH - vis;            // 路 ①
    var byInner  = docH - winH;           // 路 ②（同样成立）
    var byStart  = FULL_H - Math.min(winH, vis);  // 路 ③ 兜底
    var h = Math.max(byVisual, byInner, 0);
    if(h < 80 && byStart > 80) h = byStart;
    if(h > 0 && Math.abs(FULL_H - Math.max(docH, winH)) > 80){
      // 页面高度本身就变了（横竖屏切换 / 地址栏收起），重记满屏高
      FULL_H = Math.max(docH, winH);
      h = Math.round(Math.max(fullKbGuess(docH, winH, vis), 0));
    }
    return h > 80 ? Math.round(h) : 0;
  }
  function fullKbGuess(docH, winH, vis){
    return Math.max(docH - vis, docH - winH, 0);
  }

  function isTextField(el){
    if(!el) return false;
    var t = el.tagName;
    if(t === 'TEXTAREA') return true;
    if(t === 'INPUT'){
      var ty = (el.getAttribute('type') || 'text').toLowerCase();
      return ty === 'text' || ty === 'search' || ty === '' ;
    }
    return false;
  }

  // 自动长高：写的内容多了框跟着长，孩子不用在一个小框里挤
  function autoGrow(el){
    if(!el || el.tagName !== 'TEXTAREA') return;
    el.style.height = 'auto';
    var h = el.scrollHeight + 2;
    el.style.height = Math.min(Math.max(h, 76), 260) + 'px';
  }

  function place(){
    var kb = kbHeight();
    var changed = Math.abs(kb - lastKb) > 8;
    lastKb = kb;

    // ② body 底部留空档（数据来自样式表，改一处全生效）
    document.body.style.setProperty('--kb', kb + 'px');
    var sh = document.getElementById('sheet');
    if(sh) sh.style.setProperty('--kb', kb + 'px');

    if(kb <= 0){
      document.body.classList.remove('kb-up');
      return;
    }
    document.body.classList.add('kb-up');

    // ③ 把正在写的框顶到看得见的地方
    var el = focusedEl;
    if(!el || !isTextField(el)) return;
    if(!changed && el.getBoundingClientRect().bottom <= vh() - 8) return;

    var topGuard = 76;            // 顶部橙色标题栏高度
    var r = el.getBoundingClientRect();
    var room = vh() - topGuard - 16;
    var want = r.top - topGuard - Math.max(24, (room - r.height) / 2);
    if(r.bottom > vh() - 8 || r.top < topGuard + 8 || changed){
      window.scrollBy({ top: want, behavior: changed ? 'auto' : 'smooth' });
    }
  }

  var raf = null;
  function schedule(){
    if(raf) return;
    raf = setTimeout(function(){ raf = null; place(); }, 60);
  }

  document.addEventListener('focusin', function(e){
    var el = e.target;
    if(isTextField(el)){
      focusedEl = el;
      autoGrow(el);
      el.classList.add('editing');
      var p = el.closest ? el.closest('.q') : null;
      if(p) p.classList.add('editing');
      // 等键盘真正弹出来（约 300ms）再定位，不然量到的是没键盘的位置
      setTimeout(schedule, 120);
      setTimeout(schedule, 340);
      setTimeout(schedule, 620);
    }
  }, true);

  document.addEventListener('focusout', function(e){
    var el = e.target;
    if(isTextField(el)){
      el.classList.remove('editing');
      var p = el.closest ? el.closest('.q') : null;
      if(p) p.classList.remove('editing');
      setTimeout(function(){
        if(!isTextField(document.activeElement)){
          focusedEl = null;
          lastKb = 0;
          document.body.style.setProperty('--kb', '0px');
          var sh = document.getElementById('sheet');
          if(sh) sh.style.setProperty('--kb', '0px');
          document.body.classList.remove('kb-up');
        }
      }, 200);
    }
  }, true);

  document.addEventListener('input', function(e){
    if(e.target && e.target.tagName === 'TEXTAREA') autoGrow(e.target);
    if(isTextField(e.target)) schedule();
  }, true);

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', schedule);
    window.visualViewport.addEventListener('scroll', schedule);
  }
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', function(){ setTimeout(schedule, 300); });

  // 页面加载时把已有的 textarea 换成可长高的
  document.addEventListener('DOMContentLoaded', function(){
    var ts = document.querySelectorAll('textarea');
    for(var i=0;i<ts.length;i++){ autoGrow(ts[i]); }
  });

  /* ===== 键盘顶上的「下一题 / 上一题」快跳条 =====
     孩子在键盘弹着的时候就换题，不用先收键盘再找下一题的输入框。
     Enter 也直接跳下一题（单行题没有换行需求）。 */
  var jump = document.createElement('div');
  jump.id = 'jumpBar';
  jump.innerHTML = '<button type="button" class="jp" id="jpPrev">↑ 上一题</button>' +
                   '<span class="pos" id="jpPos"></span>' +
                   '<button type="button" class="jp main" id="jpNext">下一题 ↓</button>' +
                   '<button type="button" class="jp done" id="jpDone">✓ 收起键盘</button>';
  document.body.appendChild(jump);

  function fieldList(){
    var all = document.querySelectorAll('input[type=text],textarea');
    var out = [];
    for(var i=0;i<all.length;i++){
      var el = all[i];
      if(el.id === 'talkInput') continue;          // 聊天框不算题目
      if(el.offsetParent === null) continue;       // 隐藏的（结果框里）不算
      out.push(el);
    }
    return out;
  }

  function goTo(el){
    if(!el) return;
    el.scrollIntoView({behavior:'auto', block:'center'});
    el.focus({preventScroll:true});
    setTimeout(function(){ schedule(); refreshJump(); }, 60);
    setTimeout(function(){ schedule(); refreshJump(); }, 260);
  }

  function step(dir){
    var list = fieldList(), cur = document.activeElement, i = list.indexOf(cur);
    if(i < 0) { goTo(list[0]); return; }
    if(dir > 0){
      if(i >= list.length - 1){ document.activeElement.blur(); return; }
      goTo(list[i+1]);
    }else{
      goTo(list[Math.max(0, i-1)]);
    }
  }

  function refreshJump(){
    if(lastKb <= 0){ jump.classList.remove('show'); return; }
    var list = fieldList(), cur = document.activeElement, i = list.indexOf(cur);
    if(i < 0){ jump.classList.remove('show'); return; }
    jump.classList.add('show');
    document.getElementById('jpPos').textContent = '第 ' + (i+1) + ' / ' + list.length + ' 题';
    document.getElementById('jpPrev').style.visibility = i === 0 ? 'hidden' : 'visible';
    document.getElementById('jpNext').style.visibility = i >= list.length-1 ? 'hidden' : 'visible';
    // 记住现在在第几题，换题时立刻刷新（不必等下一次键盘 resize）
    jump.setAttribute('data-idx', i);
  }

  var _place = place;
  place = function(){ _place(); refreshJump(); };
  window.__kbPlace = place;

  document.getElementById('jpPrev').addEventListener('click', function(){ step(-1); });
  document.getElementById('jpNext').addEventListener('click', function(){ step(1); });
  document.getElementById('jpDone').addEventListener('click', function(){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  // 单行输入框按 Enter = 下一题
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var el = e.target;
    if(el && el.tagName === 'INPUT' && isTextField(el)){ e.preventDefault(); step(1); }
  }, true);

  window.__kbPlace = place;   // 给自测用
})();

/* ===== 跟老师说话（真对话） ===== */
let chatHistory = [];

function sayToTeacher(){
  const inp = document.getElementById('talkInput');
  const text = (inp.value||'').trim();
  if(!text){ inp.focus(); return; }
  const time = nowTime();
  addBubble(text, time, 'me');
  inp.value = '';

  // 老师"正在想"的占位
  const log = document.getElementById('chatlog');
  const thinking = document.createElement('div');
  thinking.className = 'bubble reply thinking';
  thinking.innerHTML = '<span class="who">圆圆老师</span><span class="dots"><i></i><i></i><i></i></span>';
  log.appendChild(thinking);
  thinking.scrollIntoView({block:'center', behavior:'smooth'});

  const t0 = Date.now();
  fetch('api/ask', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({q:text, history:chatHistory})
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    const ans = d.answer || '老师没听清，你再说一遍好不好？';
    addBubble(ans, nowTime(), 'teacher');
    speakText(ans);
    chatHistory.push({role:'user', content:text});
    chatHistory.push({role:'assistant', content:ans});
    saveChat(text, ans);
    if(d.used !== undefined){
      document.getElementById('stText').textContent = '今天已经问了 ' + d.used + ' 次';
    }
  })
  .catch(()=>{
    thinking.remove();
    addBubble('老师这边网有点慢，你等一下再问一次好不好？', nowTime(), 'teacher');
  });

  // 存孩子的问话
  saveTalk(text, time);
}

function nowTime(){
  return new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function addBubble(text, time, kind){
  const log = document.getElementById('chatlog');
  const d = document.createElement('div');
  if(kind === 'teacher'){
    d.className = 'bubble reply';
    d.innerHTML = '<span class="who">圆圆老师 · ' + time + '</span>' + escapeHtml(text).replace(/\n/g,'<br>');
  } else {
    d.className = 'bubble';
    d.innerHTML = '<span class="who">小桥 · ' + time + '</span>' + escapeHtml(text).replace(/\n/g,'<br>');
  }
  log.appendChild(d);
  d.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function saveTalk(text, time){
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem('xq_talklog')||'[]'); }catch(e){ arr=[]; }
  arr.push({text:text, time:time});
  localStorage.setItem('xq_talklog', JSON.stringify(arr));
}

function saveChat(q, a){
  // 留一份在本地，妈妈可查
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem('xq_chat')||'[]'); }catch(e){ arr=[]; }
  arr.push({q:q, a:a, t:nowTime()});
  if(arr.length > 200) arr = arr.slice(-200);
  localStorage.setItem('xq_chat', JSON.stringify(arr));
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== 聊天抽屉开关 ===== */
function openChat(){
  document.getElementById('sheet').classList.add('open');
  document.getElementById('mask').classList.add('on');
  document.getElementById('fab').classList.add('hide');
  document.body.style.overflow = 'hidden';
  setTimeout(()=>{
    const inp = document.getElementById('talkInput');
    if(inp) inp.focus();
    const log = document.getElementById('chatlog');
    if(log) log.scrollTop = log.scrollHeight;
  }, 320);
  // 第一次打开时，老师先打个招呼
  if(!localStorage.getItem('xq_greeted')){
    localStorage.setItem('xq_greeted','1');
    setTimeout(()=>{
      addBubble('小桥，我在呢。哪里不会、哪里看不懂，直接问我。不想学的时候也可以跟我说。', nowTime(), 'teacher');
    }, 420);
  }
}
function closeChat(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('mask').classList.remove('on');
  document.getElementById('fab').classList.remove('hide');
  document.body.style.overflow = '';
}


function filled(){
  return QIDS.filter(id=>document.getElementById(id).value.trim()!=='').length;
}
function updateProgress(){
  document.getElementById('prog').style.width = (filled()/QIDS.length*100)+'%';
}
updateProgress();

function submitAll(){
  stopSpeak();
  const data = {};
  QIDS.forEach(id=>{
    data[id] = document.getElementById(id).value.trim();
  });
  const n = filled();

  // 没填完先温柔问一句，不拦着
  if(n < QIDS.length){
    const go = confirm('还有 ' + (QIDS.length-n) + ' 题空着。\n\n点「取消」回去接着做，点「确定」就先交给老师。');
    if(!go){ backToWork(); return; }
  }

  const g = gradeLocal();
  speak('05_end');

  // 生成可复制文本
  let txt = '【小桥第' + QUIZ.day + '天作业】\n';
  QIDS.forEach(id=>{
    const el0 = document.getElementById(id);
    const ref = (el0 && el0.dataset.ref) || '';
    txt += ref + '：' + (data[id] || '（空着）') + '\n';
  });

  const box = document.getElementById('summaryBox');
  const gline = g.total ? ('<b>当场判了 ' + g.total + ' 道，对 ' + g.right + ' 道。</b>'
      + (g.wrongRefs.length ? '我记住这些不熟：' + g.wrongRefs.map(esc).join('、') + '，明天我会再出同类的。' : '全对，很棒。') + '<br>')
    : '';
  box.innerHTML = gline + '<b>做完了 ' + n + ' / ' + QIDS.length + ' 题</b><br>'
    + '空着的题目不是错，是告诉老师需要教的地方。<br><br>'
    + '<b>还没做完？随时可以回去接着做，填过的答案都还在。</b>';

  // 加「回去继续做」按钮（每次都重新生成，保证点得动）
  let backBtn = document.getElementById('backBtn');
  if(!backBtn){
    backBtn = document.createElement('button');
    backBtn.id = 'backBtn';
    backBtn.textContent = '← 还没做完，回去继续做';
    backBtn.style.cssText = 'display:block;width:100%;margin:14px 0 0;padding:14px;'
      + 'border:2px solid #ff8a1f;background:#fff;color:#ff8a1f;border-radius:14px;'
      + 'font-size:17px;font-weight:700;';
    backBtn.onclick = backToWork;
    box.appendChild(backBtn);
  }
  box.classList.remove('hidden');
  box.scrollIntoView({behavior:'smooth', block:'center'});

  // 复制到剪贴板
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>{
      document.getElementById('submitBtn').textContent = '已复制，拿给妈妈吧';
    }).catch(()=>{
      document.getElementById('submitBtn').textContent = '拿给妈妈看吧';
    });
  } else {
    document.getElementById('submitBtn').textContent = '拿给妈妈看吧';
  }
  document.getElementById('submitBtn').onclick = ()=>{ alert(txt); };
}

/* ===== 批改（接口已备好，等小龙虾的题库接进来才启用） =====
   现在的做法：题目、标准答案全部由调用方传进来，页面不预设任何一题。
   我硬编码的答案表已按 sandy 要求撤掉——内容归小龙虾，我只做管道。
   接口：POST api/grade
   入参 {items:[{id, stem, ref, ans, open}]}
   出参 {score, right, total, summary, missed, items:[{id, ok, say, ans}]}
*/
function gradeWith(items){
  return fetch('api/grade', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({items: items})
  }).then(r=>r.json());
}



// 回去继续做：隐藏结果框、恢复提交按钮、滚回第一题
function backToWork(){
  const box = document.getElementById('summaryBox');
  box.classList.add('hidden');
  const btn = document.getElementById('submitBtn');
  btn.textContent = '我写完了，交给老师';
  btn.onclick = submitAll;
  const first = document.getElementById(QIDS[0]);
  if(first){
    // 从第一道空着的题开始，没有空的就回第一题
    let target = QIDS.map(id=>document.getElementById(id)).find(el=>el && el.value.trim()==='');
    (target || first).scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(()=>{ if(target) target.focus({preventScroll:true}); }, 400);
  }
}
